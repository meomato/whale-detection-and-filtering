# 1-second benchmark settings.

audio_dir: data/benchmark/audio
annotation1_json: data/benchmark/annotations/annotations_v1.json
annotation2_json: data/benchmark/annotations/annotations_v2.json
output_dir: outputs/benchmark_1s

seed: 42
val_fraction: 0.15

window_size_s: 1.0
hop_size_s: 1.0
min_sound_overlap_s: 0.25

downstream_epochs: 20
early_stopping_patience: 3
learning_rate: 0.001
batch_size: 256
